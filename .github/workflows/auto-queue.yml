name: Auto-queue

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  check-dependents:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-queue ready-to-code Issues
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const { getOctokit } = require("@actions/github");
            const projectGithub = getOctokit(process.env.PROJECT_TOKEN);

            const PROJECT_ID = "PVT_kwHOBA-F8s4Bi5H2";
            const STATUS_FIELD_ID = "PVTSSF_lAHOBA-F8s4Bi5H2zhhvgpE";
            const NEXT_UP_OPTION_ID = "0a9b64b0";
            const BLOCKED_OPTION_ID = "dfdeecdc";

            const closedIssueNumber = context.payload.issue.number;

            // 1. Get all open issues in the repo (default token — posts/reads as github-actions[bot])
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 }
            );

            const dependsOnRegex = /## Depends on\s*([\s\S]*?)(\n##|$)/i;
            const taskRegex = /- \[([ x])\] #(\d+)/g;

            for (const issue of openIssues) {
              if (!issue.body) continue;
              const section = issue.body.match(dependsOnRegex);
              if (!section) continue;

              const tasks = [...section[1].matchAll(taskRegex)];
              if (tasks.length === 0) continue;

              const dependsOnClosedIssue = tasks.some(t => Number(t[2]) === closedIssueNumber);
              if (!dependsOnClosedIssue) continue;

              const allDepsClosed = await Promise.all(
                tasks.map(async (t) => {
                  const depNum = Number(t[2]);
                  if (depNum === closedIssueNumber) return true;
                  const { data } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: depNum,
                  });
                  return data.state === "closed";
                })
              );

              if (!allDepsClosed.every(Boolean)) continue;

              // Project item lookup + mutation — PROJECT_TOKEN required here
              const itemQuery = await projectGithub.graphql(`
                query($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issueNumber) {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: issue.number,
              });

              const projectItem = itemQuery.repository.issue.projectItems.nodes
                .find(node => node.project.id === PROJECT_ID);

              if (!projectItem) continue;

              const currentStatus = projectItem.fieldValueByName?.optionId;

              if (currentStatus === BLOCKED_OPTION_ID) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `All dependencies are now closed (including #${closedIssueNumber}), but this issue is marked **Blocked** — Issue will not be auto-queued.`,
                });
                continue;
              }

              await projectGithub.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, {
                projectId: PROJECT_ID,
                itemId: projectItem.id,
                fieldId: STATUS_FIELD_ID,
                optionId: NEXT_UP_OPTION_ID,
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `All dependencies closed (including #${closedIssueNumber}) — moved to **Next Up**, and this Issue is ready to be coded.`,
              });
            }
